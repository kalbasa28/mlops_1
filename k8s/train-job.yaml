apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: train
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: pull-data
          image: ghcr.io/kalbasa28/mlops_1:sha-1e56f760d5aa
          command: ["sh", "-c", "dvc pull data/raw/ai4i2020.csv.dvc && cp data/raw/ai4i2020.csv /shared/"]
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: dvc-reader-key
              mountPath: /var/secrets/gcp
              readOnly: true
      containers:
        - name: train
          image: ghcr.io/kalbasa28/mlops_1:sha-1e56f760d5aa
          envFrom:
            - configMapRef:
                name: mlflow-config
          env:
            - name: PARAMS_FILE
              value: /etc/train-params/params.yaml
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: shared-data
              mountPath: /app/data/raw/ai4i2020.csv
              subPath: ai4i2020.csv
              readOnly: true
            - name: train-params
              mountPath: /etc/train-params
              readOnly: true
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: dvc-reader-key
          secret:
            secretName: dvc-reader-key
        - name: train-params
          configMap:
            name: train-params
