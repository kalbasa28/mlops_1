apiVersion: batch/v1
kind: Job
metadata:
  name: train
  namespace: mlops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: train
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: pull-data
          image: mlops-train:e2
          command: ["sh", "-c", "dvc pull data/raw/ai4i2020.csv.dvc && cp data/raw/ai4i2020.csv /shared/"]
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/gcp/key.json
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: shared-data
              mountPath: /shared
            - name: dvc-reader-key
              mountPath: /var/secrets/gcp
              readOnly: true
      containers:
        - name: train
          image: mlops-train:e2
          env:
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow:5000
            - name: MLFLOW_EXPERIMENT_NAME
              value: predictive-maintenance
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: shared-data
              mountPath: /app/data/raw/ai4i2020.csv
              subPath: ai4i2020.csv
              readOnly: true
      volumes:
        - name: shared-data
          emptyDir: {}
        - name: dvc-reader-key
          secret:
            secretName: dvc-reader-key
