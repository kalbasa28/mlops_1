name: CI/CD

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: lint + format (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - run: pip install -r requirements-dev.txt

      - run: ruff check --output-format github .

      - run: ruff format --check --diff .

  test:
    name: unit tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - run: pip install -r requirements-train.txt -r requirements-api.txt -r requirements-dev.txt

      - run: pytest -v

  pipeline:
    name: dvc repro + quality gate
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MLFLOW_TRACKING_URI: sqlite:///ci-mlflow.db
      MLFLOW_EXPERIMENT_NAME: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - run: pip install -r requirements.txt

      - name: Pull the raw data from the GCS remote
        env:
          GCP_DVC_READER_KEY: ${{ secrets.GCP_DVC_READER_KEY }}
        run: |
          key="$RUNNER_TEMP/gcp-key.json"
          printf '%s' "$GCP_DVC_READER_KEY" > "$key"
          GOOGLE_APPLICATION_CREDENTIALS="$key" dvc pull data/raw/ai4i2020.csv.dvc
          rm "$key"

      - name: Retrain from scratch (prepare -> train -> evaluate)
        run: dvc repro --force

      - name: Quality gate - block the deploy if metrics.json is below params.yaml gate
        run: python src/gate.py

      - name: Upload metrics.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: metrics
          path: metrics.json
          if-no-files-found: warn

  build:
    name: build / ${{ matrix.image }} / ${{ matrix.arch }}
    needs: pipeline
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        image: [train, api]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: train
            dockerfile: docker/Dockerfile
            name_suffix: ''
            smoke_imports: import sklearn, mlflow, skops
          - image: api
            dockerfile: docker/api.Dockerfile
            name_suffix: '-api'
            smoke_imports: import fastapi, uvicorn, api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name and tag
        id: meta
        env:
          NAME_SUFFIX: ${{ matrix.name_suffix }}
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}$NAME_SUFFIX" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build the image locally
        env:
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          docker build --platform "linux/$ARCH" \
            -f "$DOCKERFILE" \
            --build-arg "GIT_COMMIT=$GITHUB_SHA" \
            -t mlops-image:ci .

      - name: Smoke test (non-root, packages import, commit in the label)
        env:
          SMOKE_IMPORTS: ${{ matrix.smoke_imports }}
        run: |
          docker run --rm --entrypoint python mlops-image:ci -c "import os; assert os.getuid() != 0, 'runs as root'; $SMOKE_IMPORTS"
          revision=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' mlops-image:ci)
          test "$revision" = "$GITHUB_SHA"

      - name: Trivy gate - block publishing on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: mlops-image:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Trivy full report (all severities)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: mlops-image:ci
          scanners: vuln
          exit-code: '0'
          format: json
          output: trivy-${{ matrix.image }}-${{ matrix.arch }}.json

      - name: Upload the Trivy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image }}-${{ matrix.arch }}
          path: trivy-${{ matrix.image }}-${{ matrix.arch }}.json
          if-no-files-found: warn

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the scanned image under its architecture tag
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag mlops-image:ci "$IMAGE:$TAG-$ARCH"
          docker push "$IMAGE:$TAG-$ARCH"

  publish:
    name: publish multi-arch tag
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Join amd64 + arm64 into one sha-<commit> tag per image
        run: |
          tag="sha-${GITHUB_SHA:0:12}"
          for image in "ghcr.io/${GITHUB_REPOSITORY,,}" "ghcr.io/${GITHUB_REPOSITORY,,}-api"; do
            docker buildx imagetools create --tag "$image:$tag" "$image:$tag-amd64" "$image:$tag-arm64"
            docker buildx imagetools inspect "$image:$tag"
          done

  deploy:
    name: pin the new images in k8s/
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit the new image tags to main
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="sha-${GITHUB_SHA:0:12}"
          sed -i -E "s|image: $image:sha-[0-9a-z]+|image: $image:$tag|" k8s/train-job.yaml
          sed -i -E "s|image: $image-api:sha-[0-9a-z]+|image: $image-api:$tag|" k8s/api.yaml
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: pin images to $tag"
          git push origin HEAD:main
